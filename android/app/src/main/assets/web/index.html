<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Защита в глубину: даже при будущем баге с внедрением скрипт не сможет
     утащить токен/микрофон наружу. Стили — inline (xterm вставляет свои),
     WS — только к локальному прокси-порту приложения и к самому мосту. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* wss://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Cursor Bridge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div id="tabs"></div>
    <div id="status">⚪</div>
    <button id="devBtn" title="Устройства">⚙</button>
    <button id="newBtn" title="Новая сессия">＋</button>
  </header>

  <div id="banner" class="hidden"></div>

  <div id="selbar" class="hidden">
    <button id="selCopy">Копировать</button>
    <button id="selCancel">Отмена</button>
  </div>

  <main id="termwrap">
    <div id="terminal"></div>
    <div id="placeholder">Нет активной сессии.<br>Нажмите ＋, чтобы запустить Cursor Agent.</div>
  </main>
  <button id="toBottom" class="hidden" title="В конец">▼</button>

  <div id="voice" class="hidden">
    <div id="voiceMic">🎤</div>
    <div id="voiceTimer">0:00</div>
    <div id="voiceHint">Говорите… отпустите кнопку, когда закончите</div>
    <div id="voiceBtns" class="hidden">
      <button id="voiceCancel">Отмена</button>
      <button id="voiceAccept">Принять</button>
      <button id="voiceSend">Ввод</button>
    </div>
  </div>

  <footer id="controls">
    <div id="keys">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button data-key="shifttab">⇧Tab</button>
      <button id="pasteBtn" title="Вставить из буфера">📋</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="left">←</button>
      <button data-key="right">→</button>
      <button data-key="enter">⏎</button>
      <button data-key="ctrlc">^C</button>
    </div>
    <div id="inputrow">
      <input id="msg" type="text" placeholder="Сообщение для Agent…" autocomplete="off">
      <button id="micBtn" title="Голос (удерживайте)">🎤</button>
      <button id="send" title="Отправить / удерживайте для голоса">➤</button>
    </div>
  </footer>

  <dialog id="devDialog">
    <h3>Доверенные устройства</h3>
    <div id="devList">Загрузка…</div>
    <div class="row">
      <button id="devClose">Закрыть</button>
    </div>
  </dialog>

  <dialog id="newDialog">
    <h3>Новая сессия Cursor Agent</h3>
    <label>Проект:</label>
    <input id="projectSearch" type="text" placeholder="Поиск проекта">
    <div id="projectList" class="picker"></div>
    <div id="projectEmpty" class="empty hidden">Проекты не найдены.</div>
    <label>Путь проекта:</label>
    <input id="projectCustom" type="text" placeholder="…или свой путь">
    <div id="projectHint" class="hint"></div>
    <label>Чаты / сессии в проекте:</label>
    <div id="sessionList" class="picker sessions"></div>
    <div id="sessionEmpty" class="empty">Для этого проекта пока нет сессий.</div>
    <label class="chk"><input type="checkbox" id="optResume"> --resume (выбрать прошлую сессию)</label>
    <label class="chk"><input type="checkbox" id="optForce"> --force (Run Everything)</label>
    <label class="chk"><input type="checkbox" id="optPlan"> --plan</label>
    <div class="row">
      <button id="createOk">Запустить</button>
      <button id="createCancel">Отмена</button>
    </div>
  </dialog>

  <script src="/vendor/xterm.js"></script>
  <script src="app.js"></script>
</body>
</html>
