[package]
name = "cursor-tunnel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cursor-tunnel"
path = "src/main.rs"

[dependencies]
iroh = "1.0.2"
iroh-tickets = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-stream = "0.1"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
